<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCC Glas-Metallic HUD — Design-SSOT</title>
  <style>
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .ccc-metal-frame {
      position: relative;
      width: 600px;
      height: 600px;
      padding: 15px;
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        #e6e8ea 0%,
        #a8aab0 20%,
        #f5f7f8 40%,
        #8a8d91 60%,
        #d1d3d6 80%,
        #6b6e73 100%
      );
      box-shadow:
        inset 0px 1px 2px rgba(255, 255, 255, 0.9),
        inset 0px -2px 5px rgba(0, 0, 0, 0.5),
        0px 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 0, 0, 0.3);
    }
    .ccc-inner-bezel {
      width: 100%;
      height: 100%;
      padding: 4px;
      border-radius: 8px;
      background: #1a1a1c;
      box-sizing: border-box;
      box-shadow:
        inset 0px 2px 6px rgba(0, 0, 0, 0.9),
        0px 1px 1px rgba(255, 255, 255, 0.4);
    }
    .ccc-glass-panel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      overflow: hidden;
      background: linear-gradient(160deg, #41454a 0%, #2a2d31 40%, #1a1c1e 100%);
      box-shadow: inset 0px 0px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ccc-glass-panel::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.05) 45%,
        rgba(255, 255, 255, 0) 45.1%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
      z-index: 10;
    }
    .watermark {
      font-size: 80px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.05);
      text-align: center;
      line-height: 0.9;
      pointer-events: none;
      text-shadow:
        -1px -1px 1px rgba(0, 0, 0, 0.3),
        1px 1px 1px rgba(255, 255, 255, 0.1);
    }
    .watermark-sub {
      font-size: 150px;
      display: block;
      margin-top: -20px;
    }
  </style>
</head>
<body>
  <div class="ccc-metal-frame">
    <div class="ccc-inner-bezel">
      <div class="ccc-glass-panel">
        <div class="watermark">
          AKC<br />
          <span class="watermark-sub">CCC</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
